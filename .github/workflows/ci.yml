name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: colcon build + test (ROS 2 Jazzy)
    runs-on: ubuntu-24.04
    container: ros:jazzy
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies with rosdep
        shell: bash
        # Gazebo and RViz are only needed for the interactive simulation; the CI tests use Nav2's
        # loopback simulator, so skip them to keep the job fast.
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy \
            --skip-keys "ros_gz_sim ros_gz_bridge rviz2"

      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            --event-handlers console_cohesion+

      - name: Test (unit tests, generated-file checks, headless end-to-end delivery)
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure
          colcon test-result --verbose

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            log/latest_test
            build/*/test_results

      - name: clang-format and clang-tidy (pinned 23.1.3)
        shell: bash
        run: |
          apt-get install -y --no-install-recommends python3-pip
          pip3 install --break-system-packages clang-format==23.1.3 clang-tidy==23.1.3
          source /opt/ros/jazzy/setup.bash
          WDR_BUILD_DIR=build bash tools/lint.sh

  docker:
    name: Docker dev image builds
    runs-on: ubuntu-24.04
    # The full image (Gazebo + Nav2 + RViz) is large; build it on main and on demand, not on every push.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Build the image (deps + workspace)
        run: docker build -f docker/Dockerfile -t wdr:ci .
      - name: Unit tests inside the image
        run: >
          docker run --rm wdr:ci bash -c "source /opt/ros/jazzy/setup.bash && source /ws/install/setup.bash &&
          colcon test --packages-select wdr_sim wdr_mission wdr_tools --return-code-on-test-failure &&
          colcon test-result --verbose"
