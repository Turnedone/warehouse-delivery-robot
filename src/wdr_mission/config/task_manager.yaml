task_manager:
  ros__parameters:
    # stations_file and behavior_tree are set by wdr_bringup/launch/mission.launch.py

    # BT plugin libraries: Nav2's nodes used by the mission tree, plus our own.
    plugin_lib_names:
      - nav2_navigate_to_pose_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_wait_action_bt_node
      - opennav_dock_action_bt_node
      - opennav_undock_action_bt_node
      - wdr_mission_bt_nodes

    bt_loop_duration_ms: 10          # tree tick period
    server_timeout_ms: 20            # Nav2 BT nodes: wait this long for a server reply per tick
    wait_for_service_timeout_ms: 1000

    queue_capacity: 20
    low_battery: 0.30                # below this, charge before starting an order
    resume_battery: 0.90             # charge up to this before taking orders again
    charge_timeout_s: 3600.0
    nav_attempts: 3                  # NavigateToPose attempts per leg (Nav2 recovers inside each)
    operator_timeout_s: 120.0        # fail the order if nobody loads/unloads the robot in time
    operator_auto_confirm_s: 3.0     # simulated operator; negative = wait for /wdr/operator_confirm
    dock_id: home_dock
    exception_station: qa_hold       # where a loaded robot parks when an order fails
    start_docked: true               # the robot spawns on the charger
    idle_dock_after_s: 10.0          # go back to the charger after this long without orders
    groot_port: 0                    # > 0: publish the tree to Groot2 on this port
    # Orders wait until these Nav2 lifecycle managers report active (their is_active service)
    nav2_lifecycle_managers: [lifecycle_manager_localization, lifecycle_manager_navigation]
